# Codex config for ReconcileBench harness runs. Copied into a fresh per-episode CODEX_HOME.
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
approval_policy = "never"
web_search = "disabled"

[sandbox_workspace_write]
network_access = false

# Off: anything that reaches outside the episode workspace or adds non-default tooling.
[features]
apps = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
computer_use = false
image_generation = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false
